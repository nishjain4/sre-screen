name: Repository Validation
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: validation-untrusted
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ gitea.event.pull_request.head.sha || gitea.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation dependencies
        run: python -m pip install -e ./backend -r automation/requirements.txt -r gitea_mcp/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Validate changes
        run: python automation/validate.py
      - name: Retain reports and logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: validation-results
          path: validation-results/
          if-no-files-found: warn
          retention-days: 30
