[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-svc-sre"
version = "1.0.0"
description = "SRE investigation service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0",
  "boto3>=1.37",
  "uvicorn>=0.34",
  "truststore>=0.10",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=1.0", "httpx>=0.28"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.skills" = ["playbooks/*/SKILL.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]